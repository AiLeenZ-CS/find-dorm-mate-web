<h2 mat-dialog-title>ปฏิเสธคำร้อง: {{ data.ownerName }}</h2>

<mat-dialog-content>
  <p class="hint">ระบุเหตุผลที่ปฏิเสธ (ผู้สมัครจะเห็นข้อความนี้)</p>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>หมายเหตุจากแอดมิน</mat-label>
    <textarea matInput rows="4" [(ngModel)]="adminNote" name="adminNote"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">ยกเลิก</button>
  <button mat-flat-button color="warn" (click)="confirm()">ยืนยันการปฏิเสธ</button>
</mat-dialog-actions>
