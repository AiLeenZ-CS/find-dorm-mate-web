<div class="confirm-dialog" [class.tone-danger]="tone === 'danger'">
  <div class="icon-badge">
    <mat-icon>{{ icon }}</mat-icon>
  </div>

  <h2 mat-dialog-title>{{ data.title }}</h2>

  <mat-dialog-content>
    <p class="message">{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">{{ data.cancelLabel ?? 'ยกเลิก' }}</button>
    <button
      mat-flat-button
      class="confirm-btn"
      [color]="tone === 'danger' ? 'warn' : 'primary'"
      (click)="confirm()"
    >
      {{ data.confirmLabel ?? 'ยืนยัน' }}
    </button>
  </mat-dialog-actions>
</div>
